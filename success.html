<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Submitted Successfully</title>
    <!-- Incluindo o Bootstrap 5 para manter o padrão do seu site -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Incluindo os ícones do Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- Você pode vincular seus próprios arquivos CSS aqui para manter a consistência total -->
    <link rel="stylesheet" href="navbar.css">
    <link rel="stylesheet" href="contact.css">
    <style>
        /* Estilos básicos para centralizar o conteúdo e garantir a altura */
        body, html {
            height: 100%;
        }
        body {
            display: flex;
            flex-direction: column;
            background-color: #f8f9fa; /* Fundo cinza claro para o corpo da página */
        }
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .success-container {
            text-align: center;
            padding: 2rem;
            background-color: #ffffff; /* Fundo branco para o container da mensagem */
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        /* Estilo para o botão de voltar, similar ao btn-getstarted */
        .btn-goback {
            background-color: #facc15;
            color: #fff;
            border-radius: 50px;
            padding: 10px 25px;
            text-transform: uppercase;
            font-weight: bold;
            text-decoration: none;
            transition: background-color 0.3s;
        }
        .btn-goback:hover {
            background-color: #eab308;
            color: #fff;
        }

        /* --- ALTERAÇÕES SOLICITADAS --- */
        /* Forçando a cor de fundo verde na navbar */
        #header {
            background-color: rgb(0, 110, 106) !important;
        }
        /* Alterando a cor dos links da navbar para branco para garantir a legibilidade */
        #navmenu ul a {
            color: #ffffff;
        }
        /* Alterando a cor do link ativo/hover para o amarelo do botão */
        #navmenu ul a:hover, #navmenu ul a.active {
            color: #facc15;
        }
        /* Alterando a cor do ícone do menu mobile */
        .mobile-nav-toggle {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <!-- Cabeçalho - idêntico ao do seu site para manter o padrão -->
    <header id="header" class="header d-flex align-items-center fixed-top shadow-sm">
        <div class="container position-relative d-flex align-items-center justify-content-between">
            <a href="index.html" class="logo d-flex align-items-center me-auto me-xl-0">
                <!-- Certifique-se de que o caminho para a imagem do logo está correto -->
                <img src="img/G-01.png" alt="Organnact Partner Program Logo" onerror="this.onerror=null;this.src='https://placehold.co/150x50/FFFFFF/000000?text=Logo';">
            </a>
            <nav id="navmenu" class="navmenu">
                <ul>
                    <li><a href="index.html#hero">Home</a></li>
                    <li><a href="index.html#earnings">Your Earnings</a></li>
                    <li><a href="index.html#how-it-work">How It Works</a></li>
                    <li><a href="index.html#advantages">Advantages</a></li>
                    <li><a href="index.html#participate">Who Can Participate</a></li>
                    <li><a href="index.html#contact">Contact</a></li>
                </ul>
                <i class="mobile-nav-toggle d-xl-none bi bi-list"></i>
            </nav>
            <a class="btn-getstarted" href="index.html#contact" title="I WANT TO BE A PARTNER">I WANT TO BE A PARTNER</a>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main>
        <div class="success-container">
            <!-- Ícone de sucesso usando Bootstrap Icons -->
            <i class="bi bi-check-circle-fill text-success" style="font-size: 4rem;"></i>
            
            <!-- Mensagem de Sucesso -->
            <h1 class="display-4 fw-bold text-dark my-3">
                Your form has been sent successfully!
            </h1>
            <p class="lead text-secondary mb-4">
                Thank you for contacting us. We will get back to you soon. :)
            </p>

            <!-- Botão para Voltar -->
            <a href="index.html" class="btn-goback">
                Go Back
            </a>
        </div>
    </main>

    <!-- Incluindo o JavaScript do Bootstrap no final do body -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
